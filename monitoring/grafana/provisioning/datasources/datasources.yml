# ==============================================
# Grafana 数据源配置
# ==============================================

apiVersion: 1

datasources:
  # Prometheus数据源
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: "15s"
      queryTimeout: "60s"
      httpMethod: "POST"

  # PostgreSQL数据源（可选）
  - name: PostgreSQL
    type: postgres
    access: proxy
    url: postgres:5432
    user: ${POSTGRES_USER:-nlp_user}
    secureJsonData:
      password: ${POSTGRES_PASSWORD:-nlp_pass}
    jsonData:
      database: ${POSTGRES_DB:-nlp_db}
      sslmode: "disable"

  # Loki日志数据源（可选）
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: true
