  # 警告告警接收器
  - name: 'warning'
    # slack_configs:
    #   - channel: '#alerts-warning'
    #     title: '⚠️ 警告告警: {{ .GroupLabels.alertname }}'
    #     text: '{{ .CommonAnnotations.description }}'
    #     send_resolved: true
