global:
  resolve_timeout: 5m
  slack_api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'  # 可选：Slack告警

# 告警接收模板
templates:
  - '/etc/alertmanager/templates/*.tmpl'

# 告警路由
route:
  receiver: 'default'
  group_by: ['alertname', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

  # 子路由：关键告警
  routes:
    # 关键告警：立即通知
    - match:
        severity: critical
      receiver: 'critical'
      continue: true
      group_wait: 10s
      repeat_interval: 1h

    # 警告告警
    - match:
        severity: warning
      receiver: 'warning'
      continue: true

    # 信息告警
    - match:
        severity: info
      receiver: 'info'

# 接收器配置
receivers:
  # 默认接收器
  - name: 'default'
    # email_configs:
    #   - to: 'admin@example.com'
    #     from: 'alertmanager@example.com'
    #     smarthost: 'smtp.example.com:587'
    #     auth_username: 'alertmanager'
    #     auth_password: 'password'

  # 关键告警接收器
  - name: 'critical'
    # Slack配置示例
