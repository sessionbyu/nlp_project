  # 信息告警接收器
  - name: 'info'
    # slack_configs:
    #   - channel: '#alerts-info'
    #     title: 'ℹ️ 信息: {{ .GroupLabels.alertname }}'
    #     text: '{{ .CommonAnnotations.description }}'
    #     send_resolved: true
    #     color: 'good'

# 抑制规则
inhibit_rules:
  # 关键告警抑制警告
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['service']

  # 服务不可用抑制其他告警
  - source_match:
      alertname: 'BackendDown'
    target_match_re:
      alertname: '.*'
    equal: ['service']
