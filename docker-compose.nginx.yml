version: '3.8'

# ==============================================
# NLP 项目 - 添加 Nginx 服务的完整配置
# 使用方法：
#   1. 备份原 docker-compose.yml
#   2. 复制此文件到 docker-compose.yml
#   3. 修改域名配置
#   4. 运行: docker-compose up -d nginx
# ==============================================

services:
  # ==============================================
  # Nginx 反向代理
  # ==============================================
  nginx:
    image: nginx:alpine
    container_name: nlp_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Nginx 配置
      - ./nginx/nginx-docker.conf:/etc/nginx/conf.d/default.conf:ro
      # SSL 证书（如果使用）
      - ./nginx/ssl:/etc/nginx/ssl:ro
      # Let's Encrypt 证书（如果使用 certbot）
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot
      # Nginx 日志
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - frontend-vue
      - backend
    restart: unless-stopped
    networks:
      - backend
    command: /bin/sh -c "nginx -g 'daemon off;'"

  # ==============================================
  # Certbot（SSL 证书自动续期，可选）
  # ==============================================
  certbot:
    image: certbot/certbot
    container_name: nlp_certbot
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    restart: unless-stopped
    networks:
      - backend

# ==============================================
# 其他服务保持不变...
# ==============================================

  # 后端服务：FastAPI NLP 推理接口
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    container_name: nlp_backend
    entrypoint: ["/app/entrypoint.sh"]
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8000:8000"  # 只监听本地，通过 nginx 对外
    volumes:
      - ./backend/app:/app/app
      - ./backend/docker-entrypoint.sh:/app/entrypoint.sh:ro
      - ./data:/data
      - ./logs/backend:/app/logs/backend
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      - PYTHONPATH=/app
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER:-nlp_user}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-nlp_pass}
      - DB_NAME=${POSTGRES_DB:-nlp_db}
      - MODEL_PATH=/data/models/bert-base-chinese
      - USE_CACHE=true
      - LOG_LEVEL=INFO
      - LOG_DIR=/app/logs/backend
      - CORS_ORIGINS=${CORS_ORIGINS}
      - TZ=${TZ}
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - backend

  # 前端服务：Vue 3 + Element Plus
  frontend-vue:
    build:
      context: ./frontend-vue
      dockerfile: Dockerfile
    restart: unless-stopped
    container_name: nlp_frontend_vue
    # 移除外网端口映射，只通过 nginx 访问
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - VITE_API_BASE_URL=http://backend:8000
      - VITE_API_TIMEOUT=10000
      - TZ=${TZ}
    volumes:
      - ./logs/frontend-vue:/var/log/nginx
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - backend

  # Redis 服务
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    container_name: nlp_redis
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --save 60 1
      --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "--pass", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - backend
    environment:
      - TZ=${TZ}
      - REDIS_PASSWORD=${REDIS_PASSWORD}

  # PostgreSQL 服务
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    container_name: nlp_postgres
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-nlp_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-nlp_pass}
      - POSTGRES_DB=${POSTGRES_DB:-nlp_db}
      - TZ=${TZ}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nlp_user} -d ${POSTGRES_DB:-nlp_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - backend

# ==============================================
# 命名卷
# ==============================================
volumes:
  redis_data:
  postgres_data:
  letsencrypt:
  certbot-www:

# ==============================================
# 网络
# ==============================================
networks:
  backend:
    driver: bridge
