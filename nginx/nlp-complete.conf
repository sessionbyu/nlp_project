# ==============================================
# NLP 项目完整 Nginx 配置
# 包含前端 + 后端 API + WebSocket 支持
# ==============================================

# 上游服务
upstream nlp_backend {
    server 127.0.0.1:8000;  # FastAPI 后端
    # 如果后端在其他服务器，改为实际 IP
    # server 192.168.88.134:8000;
}

upstream nlp_frontend {
    server 127.0.0.1:3000;  # Vue 前端
}

# ==============================================
# HTTP 配置
# ==============================================
server {
    listen 80;
    server_name nlp.yourdomain.com api.nlp.yourdomain.com;  # 修改为你的域名

    # Let's Encrypt 证书路径（用于自动获取 SSL）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # HTTP 重定向到 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ==============================================
# HTTPS 配置
# ==============================================
server {
    listen 443 ssl http2;
    server_name nlp.yourdomain.com;

    # SSL 证书配置
    ssl_certificate /etc/letsencrypt/live/nlp.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nlp.yourdomain.com/privkey.pem;

    # SSL 安全配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # HSTS（强制 HTTPS）
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # 安全头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # 访问日志
    access_log /var/log/nginx/nlp-frontend-access.log;
    error_log /var/log/nginx/nlp-frontend-error.log;

    # 前端静态资源（长期缓存）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";

        # 不记录静态资源访问日志
        access_log off;
    }

    # SPA 路由支持
    location / {
        proxy_pass http://nlp_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 支持
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# ==============================================
# API 域名配置（可选）
# ==============================================
server {
    listen 443 ssl http2;
    server_name api.nlp.yourdomain.com;

    ssl_certificate /etc/letsencrypt/live/nlp.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nlp.yourdomain.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header X-Content-Type-Options "nosniff" always;

    access_log /var/log/nginx/nlp-api-access.log;
    error_log /var/log/nginx/nlp-api-error.log;

    # API 代理到后端
    location / {
        proxy_pass http://nlp_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;  # 长时间推理任务
        proxy_read_timeout 300s;
    }
}

# HTTP 重定向
server {
    listen 80;
    server_name api.nlp.yourdomain.com;
    return 301 https://$host$request_uri;
}
