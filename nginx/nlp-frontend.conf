# ==============================================
# NLP 前端域名配置
# 将前端映射为域名访问
# ==============================================

# 上游服务 - Docker 容器中的前端
upstream nlp_frontend {
    server 127.0.0.1:3000;  # Docker 映射的前端端口
    # 如果前端在其他服务器，改为实际 IP
    # server 192.168.88.134:3000;
}

server {
    listen 80;
    server_name nlp.yourdomain.com;  # 修改为你的域名

    # 日志配置
    access_log /var/log/nginx/nlp-frontend-access.log;
    error_log /var/log/nginx/nlp-frontend-error.log;

    # 客户端最大上传大小
    client_max_body_size 100M;

    # 前端静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
    }

    # SPA 路由支持
    location / {
        proxy_pass http://nlp_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 支持（如果需要）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # API 代理（可选：直接在 nginx 层代理 API）
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;  # 后端 API 地址
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 健康检查端点
    location /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}

